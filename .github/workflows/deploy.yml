name: Build and Deploy to Dokploy

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      IMAGE_NAME: ${{ secrets.DOKPLOY_IMAGE_NAME }}
      REGISTRY: ${{ secrets.DOKPLOY_REGISTRY }}
      REGISTRY_USERNAME: ${{ secrets.DOKPLOY_REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.DOKPLOY_REGISTRY_PASSWORD }}
      PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID }}
      PUBLIC_SANITY_DATASET: ${{ secrets.PUBLIC_SANITY_DATASET }}
      PUBLIC_PAGE_TITLE: ${{ secrets.PUBLIC_PAGE_TITLE }}
      PUBLIC_NAVBAR_TITLE: ${{ secrets.PUBLIC_NAVBAR_TITLE }}
      PUBLIC_COPYRIGHT_HOLDER: ${{ secrets.PUBLIC_COPYRIGHT_HOLDER }}
      SANITY_STUDIO_STUDIO_HOST: ${{ secrets.SANITY_STUDIO_STUDIO_HOST }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args:
            PUBLIC_SANITY_PROJECT_ID=${{ env.PUBLIC_SANITY_PROJECT_ID }}
            PUBLIC_SANITY_DATASET=${{ env.PUBLIC_SANITY_DATASET }}
            PUBLIC_PAGE_TITLE=${{ env.PUBLIC_PAGE_TITLE }}
            PUBLIC_NAVBAR_TITLE=${{ env.PUBLIC_NAVBAR_TITLE }}
            PUBLIC_COPYRIGHT_HOLDER=${{ env.PUBLIC_COPYRIGHT_HOLDER }}
            SANITY_STUDIO_STUDIO_HOST=${{ env.SANITY_STUDIO_STUDIO_HOST }}

      # Optional: ping Dokploy API to trigger/redeploy the app
      - name: Trigger Dokploy deployment
        if: env.DOKPLOY_DEPLOY_HOOK_URL != ''
        env:
          DOKPLOY_DEPLOY_HOOK_URL: ${{ secrets.DOKPLOY_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Dokploy deployment..."
          curl -X POST "$DOKPLOY_DEPLOY_HOOK_URL" -H "Content-Type: application/json" -d '{}'